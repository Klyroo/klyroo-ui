name: Feature request
description: Suggest an improvement to Klyroo.UI.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind, with a usage example.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
