name: Bug report
description: Something in Klyroo.UI does not work as documented.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security problems go through [SECURITY.md](../blob/main/SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: Klyroo.UI 0.1.0-preview.1
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Render mode / platform
      multiple: true
      options:
        - Static SSR
        - Interactive Server
        - Interactive WebAssembly
        - Interactive Auto
        - .NET MAUI Blazor Hybrid
        - Headless (.Core only)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or project that shows the problem.
      render: razor
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: .NET SDK (`dotnet --version`), OS, browser.
