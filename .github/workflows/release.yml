name: Release

# Runs on version tags only (v0.1.0, v0.2.0-beta.1, ...). Never on branches or pull requests.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  publish:
    name: Pack and push to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: The tag matches the package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(dotnet msbuild src/Blux.UI -getProperty:PackageVersion)
          if [ "$expected" != "$actual" ]; then echo "Tag $GITHUB_REF_NAME does not match PackageVersion $actual in src/Blux.UI/Blux.UI.csproj"; exit 1; fi
      - name: The changelog has an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          grep -qE "^## \[(${version}|${core})\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${core}]' section"; exit 1; }

      - run: npm ci
      - name: Generated assets are up to date
        run: |
          npm run build
          changes=$(git status --porcelain -- src/Blux.UI/styles/generated src/Blux.UI/wwwroot playground/Blux.Playground/Blux.Playground/wwwroot/site.css)
          if [ -n "$changes" ]; then echo "Run npm run build and commit:"; echo "$changes"; exit 1; fi

      - run: dotnet build Blux.UI.slnx -c Release
      - name: Unit tests (net10.0 and net11.0)
        run: dotnet test --project tests/Blux.UI.Tests -c Release --no-build
      - name: Package check
        run: node build/verify-package.mjs --online
      - name: Pack
        run: dotnet pack src/Blux.UI -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/*

      # NUGET_API_KEY: repository secret holding a nuget.org API key scoped to the Blux.UI package.
      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
