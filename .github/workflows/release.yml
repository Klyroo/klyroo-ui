name: Release

# Runs on version tags only (v0.1.0, v0.2.0-beta.1, ...). Never on branches or pull requests.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Check, build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "Tag $GITHUB_REF_NAME points to a commit that is not on main"; exit 1; fi
      - name: The tag matches the package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(dotnet msbuild src/Blux.UI -getProperty:PackageVersion)
          if [ "$expected" != "$actual" ]; then echo "Tag $GITHUB_REF_NAME does not match PackageVersion $actual in src/Blux.UI/Blux.UI.csproj"; exit 1; fi
      - name: The changelog has a dated entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          grep -qE "^## \[(${version}|${core})\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${core}] - YYYY-MM-DD' section"; exit 1; }

      - run: npm ci
      - name: Generated assets are up to date
        run: |
          npm run build
          changes=$(git status --porcelain -- src/Blux.UI/styles/generated src/Blux.UI/wwwroot playground/Blux.Playground/Blux.Playground/wwwroot/site.css)
          if [ -n "$changes" ]; then echo "Run npm run build and commit:"; echo "$changes"; exit 1; fi

      - run: dotnet build Blux.UI.slnx -c Release
      - name: Unit tests (net10.0 and net11.0)
        run: dotnet test --project tests/Blux.UI.Tests -c Release --no-build
      - name: MCP tests
        run: dotnet test --project tests/Blux.UI.Mcp.Tests -c Release --no-build
      - name: Package check
        run: node build/verify-package.mjs --online
      - name: Pack the library and the MCP tool (same version)
        run: |
          dotnet pack src/Blux.UI -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Mcp -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # Separate job: it runs none of the build's third-party code (npm install scripts, MSBuild tasks), so nothing can put
  # a fake dotnet on the PATH before the key is used. The "nuget" environment holds the secret and can require an approval.
  publish:
    name: Push to nuget.org
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: nuget
          path: artifacts
      # NUGET_API_KEY: secret of the "nuget" environment, a nuget.org API key scoped to the Blux.UI and Blux.UI.Mcp packages.
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
