name: Release

# Releases are cut from a `v<version>` tag whose version matches build/Version.props
# (VersionPrefix/VersionSuffix, imported by Directory.Build.props). The publish job runs in the `nuget` environment: configure required
# reviewers on it (Settings > Environments) so nothing reaches nuget.org without a human approval.
# NuGet authentication uses Trusted Publishing (GitHub OIDC): no long-lived API key is stored.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test and pack only (no NuGet push, no GitHub Release)
        type: boolean
        default: true
      sibling-ref:
        description: Branch or tag of the sibling repositories, used only when the run is not on a tag (a run on a tag uses that tag)
        type: string
        default: main

permissions:
  contents: read

env:
  # The sibling repositories are built from source (relative project references), so a release builds them at the
  # same tag: the packages then depend on exactly the code that was released with them, not on whatever main holds.
  SIBLING_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.sibling-ref || 'main' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: klyroo-ui
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-ui
      - name: Wait for the release tag in the sibling repositories
        if: github.ref_type == 'tag'
        run: |
          # The nine repositories are tagged one after another: give the others time to receive the same tag.
          for r in klyroo-agent klyroo-dashboard klyroo-display klyroo-form klyroo-query klyroo-spreadsheet klyroo-stack klyroo-table; do
            for i in $(seq 1 30); do
              git ls-remote --exit-code --tags "https://github.com/klyroo/$r.git" "refs/tags/$SIBLING_REF" >/dev/null && break
              if [ "$i" = 30 ]; then echo "::error::klyroo/$r has no tag $SIBLING_REF after about 15 minutes: tag every repository with the same version"; exit 1; fi
              sleep 30
            done
          done
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
          ref: ${{ env.SIBLING_REF }}
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
          ref: ${{ env.SIBLING_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Resolve and check the version
        id: version
        run: |
          version=$(dotnet msbuild src/Klyroo.UI/Klyroo.UI.csproj -getProperty:PackageVersion -p:Configuration=Release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version of build/Version.props"
            exit 1
          fi
      - name: Build
        run: dotnet build Klyroo.UI.slnx -c Release --nologo
      - name: Test
        run: dotnet test Klyroo.UI.slnx -c Release --no-build --nologo
      - name: Pack
        run: dotnet pack Klyroo.UI.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - name: Verify NuGet metadata
        run: |
          fail=0
          for p in ./artifacts/nupkgs/*.nupkg; do
            spec=$(unzip -p "$p" '*.nuspec')
            for tag in '<id>' '<version>' '<authors>' '<description>' '<license type="expression">MIT' '<readme>' '<icon>' '<projectUrl>' '<repository type="git" url="https://github.com/klyroo/' '<tags>'; do
              if ! grep -qF "$tag" <<<"$spec"; then echo "::error::$(basename "$p"): missing $tag"; fail=1; fi
            done
            if grep -qiE '\blux\b|luxstack' <<<"$spec"; then echo "::error::$(basename "$p"): old brand in metadata"; fail=1; fi
          done
          exit $fail
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > ./artifacts/release-notes.md
          if [ ! -s ./artifacts/release-notes.md ]; then echo "::warning::No CHANGELOG.md section for $v"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            klyroo-ui/artifacts/nupkgs/*
            klyroo-ui/artifacts/release-notes.md

  # Checks the packed .nupkg and .snupkg files themselves (contents, metadata, dependencies), then builds a throwaway
  # Blazor app that consumes them from a local feed in both CSS modes. It is a required job: publish needs it.
  verify-package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Verify the packed NuGet packages
        # --online: the consumer app restores the framework packages and downloads the Tailwind CLI.
        run: node build/verify-package.mjs --online --packages release/nupkgs

  publish:
    needs: [build, verify-package]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: NuGet login (OIDC, short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: |
          dotnet nuget push "release/nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${{ needs.build.outputs.version }}"
          notes=(--generate-notes)
          [ -s release/release-notes.md ] && notes=(--notes-file release/release-notes.md)
          prerelease=()
          [[ "$v" == *-* ]] && prerelease=(--prerelease)
          gh release create "v$v" release/nupkgs/*.nupkg --title "v$v" --target "$GITHUB_SHA" "${notes[@]}" "${prerelease[@]}"
