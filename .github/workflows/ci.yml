name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build
        run: dotnet build Lux.UI.slnx -c Release --nologo
      - name: Run Tests
        run: dotnet test Lux.UI.slnx -c Release --no-build --nologo
      - name: Pack NuGet Artifacts
        run: dotnet pack Lux.UI.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-lux-ui
          path: ./artifacts/nupkgs/*.nupkg
