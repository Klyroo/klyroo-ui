name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klyroo-ui
    steps:
      - uses: actions/checkout@v7
        with:
          path: klyroo-ui
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
      - name: Check out klyroo-table (referenced by relative path)
        uses: actions/checkout@v7
        with:
          repository: klyroo/klyroo-table
          path: klyroo-table
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: dotnet restore Klyroo.UI.slnx
      - name: Build
        run: dotnet build Klyroo.UI.slnx -c Release --no-restore --nologo
      - name: Test
        run: dotnet test Klyroo.UI.slnx -c Release --no-build --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: klyroo-ui/package-lock.json
      - name: JavaScript tests
        run: |
          npm ci
          npm run test:js
      - name: Formatting report
        # Reported, not blocking yet: the code predates .editorconfig. Remove continue-on-error after a one-time
        # `dotnet format` commit.
        continue-on-error: true
        run: dotnet format Klyroo.UI.slnx --verify-no-changes --no-restore --include src/ tests/ build/ samples/
      - name: Pack
        run: dotnet pack Klyroo.UI.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - name: Verify NuGet metadata
        run: |
          fail=0
          for p in ./artifacts/nupkgs/*.nupkg; do
            spec=$(unzip -p "$p" '*.nuspec')
            for tag in '<id>' '<version>' '<authors>' '<description>' '<license type="expression">MIT' '<readme>' '<projectUrl>' '<repository type="git" url="https://github.com/klyroo/' '<tags>'; do
              if ! grep -qF "$tag" <<<"$spec"; then echo "::error::$(basename "$p"): missing $tag"; fail=1; fi
            done
            if grep -qiE '\blux\b|luxstack' <<<"$spec"; then echo "::error::$(basename "$p"): old brand in metadata"; fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-klyroo-ui
          path: klyroo-ui/artifacts/nupkgs/*
