name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build, generated assets, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The CSS and JS in src/Blux.UI/wwwroot are committed: rebuilding them must change nothing.
      - name: Generated assets are up to date
        run: |
          npm run build
          changes=$(git status --porcelain -- src/Blux.UI/styles/generated src/Blux.UI/wwwroot src/Blux.UI.Tools/styles/generated src/Blux.UI.Tools/wwwroot src/Blux.UI.Tools/Icons playground/Blux.Playground/Blux.Playground/wwwroot/site.css)
          if [ -n "$changes" ]; then echo "Run npm run build and commit:"; echo "$changes"; exit 1; fi

      - name: Browser code unit tests (spatial navigation geometry)
        run: npm run test:js
      - run: dotnet build Blux.UI.slnx -c Release
      - name: Unit tests (net10.0 and net11.0)
        run: dotnet test --project tests/Blux.UI.Tests -c Release --no-build
      - name: Blux.UI.Tools tests (net10.0 and net11.0)
        run: dotnet test --project tests/Blux.UI.Tools.Tests -c Release --no-build
      - name: Blux.UI.Tools.Query tests (net10.0 and net11.0)
        run: dotnet test --project tests/Blux.UI.Tools.Query.Tests -c Release --no-build
      # The IQueryable applier translated by EF Core to SQLite SQL and compared with the in-memory executor on the same rows.
      - name: Blux.UI.Tools.Query against EF Core and SQLite (net10.0)
        run: dotnet test --project tests/Blux.UI.Tools.Query.EfTests -c Release --no-build
      # Backs IsAotCompatible: the in-memory executor, published with NativeAOT and run (needs clang, which the runner image has).
      - name: Blux.UI.Tools.EntityFrameworkCore adapter against EF Core and SQLite (net10.0)
        run: dotnet test --project tests/Blux.UI.Tools.EntityFrameworkCore.Tests -c Release --no-build

      - name: Blux.UI.Tools.Query NativeAOT smoke
        run: |
          dotnet publish tests/Blux.UI.Tools.Query.AotSmoke -c Release -r linux-x64 -o "$RUNNER_TEMP/aot-smoke"
          "$RUNNER_TEMP/aot-smoke/Blux.UI.Tools.Query.AotSmoke"
      - name: AI tooling tests (bundle, MCP tools, llms.txt, skill)
        run: dotnet test --project tests/Blux.UI.Mcp.Tests -c Release --no-build
      - name: Template demo supervisor tests (docs host, fake demo, watchdog)
        run: dotnet test --project tests/Blux.Playground.Tests -c Release --no-build
      - name: Image provider and local optimizer tests
        run: |
          dotnet test --project tests/Blux.UI.Images.Tests -c Release --no-build
          dotnet test --project tests/Blux.UI.Images.Local.Tests -c Release --no-build
      - name: Pack
        run: |
          dotnet pack src/Blux.UI -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Mcp -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Images -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Images.Local -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Tools.Query -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Tools -c Release --no-build -o artifacts
          dotnet pack src/Blux.UI.Tools.EntityFrameworkCore -c Release --no-build -o artifacts
      # Inspects the .nupkg and .snupkg, then builds a throwaway Blazor Web App against the package in both CSS modes.
      # It packs on its own and needs the network on a fresh runner (framework packages), hence --online.
      - name: Package check
        run: node build/verify-package.mjs --online
      # The project templates (templates/*): the web apps are built from the source of the library by the solution build above (Blux.UI.slnx lists
      # them); this exports each one as a repository of its own and builds, runs and renames it against the packed Blux.UI. Needs the network, hence
      # after the package check, which warms the NuGet cache.
      # The browser part of the check (the published template in Chromium) uses the E2E project and its Playwright browser.
      - name: Install Chromium for the template check
        run: |
          dotnet build tests/Blux.UI.E2E
          pwsh tests/Blux.UI.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Template check
        run: node build/verify-templates.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/*.nupkg

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Blux.UI.E2E
      - name: Install browser
        run: pwsh tests/Blux.UI.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps ${{ matrix.browser }}
      # Every test runs in the four render modes of the playground: ssr, server, wasm, auto.
      - name: E2E tests
        run: dotnet test --project tests/Blux.UI.E2E --no-build
        env:
          BLUX_BROWSER: ${{ matrix.browser }}

  e2e-published:
    name: E2E on the published, trimmed build (chromium)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish playground/Blux.Playground/Blux.Playground -c Release -o published
      # The live demos of the templates run published too: one publish output per template, in the folder the docs host reads.
      - run: dotnet publish templates/starter/src/Starter.Web -c Release -o published-templates/starter
      - run: dotnet publish templates/landing/src/Landing.Web -c Release -o published-templates/landing
      - run: dotnet build tests/Blux.UI.E2E
      - name: Install browser
        run: pwsh tests/Blux.UI.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: E2E tests
        run: dotnet test --project tests/Blux.UI.E2E --no-build
        env:
          BLUX_PLAYGROUND_PUBLISHED: published
          BLUX_TEMPLATES_PUBLISHED: published-templates

  # The Blazor Hybrid sample (samples/Blux.Maui) and the MAUI heads of the app templates (templates/*/src/*.Maui): the shared pages in a BlazorWebView. Each platform builds on its own runner;
  # iOS and Mac Catalyst need macOS, Windows needs Windows. Not run locally except for Android.
  maui:
    name: MAUI sample and templates (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, os: ubuntu-latest, workload: maui-android, framework: net10.0-android }
          - { name: windows, os: windows-latest, workload: maui-windows, framework: net10.0-windows10.0.19041.0 }
          - { name: ios, os: macos-latest, workload: maui-ios, framework: net10.0-ios, args: "-p:RuntimeIdentifier=iossimulator-arm64" }
          - { name: maccatalyst, os: macos-latest, workload: maui-maccatalyst, framework: net10.0-maccatalyst, args: "-p:EnableCodeSigning=false" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        if: matrix.name == 'android'
        with:
          distribution: microsoft
          java-version: 17
      - run: npm ci
      - name: Install the MAUI workload
        run: dotnet workload install ${{ matrix.workload }}
      - name: Build the sample
        working-directory: samples/Blux.Maui
        run: dotnet build Blux.Maui/Blux.Maui.csproj -f ${{ matrix.framework }} -c Release ${{ matrix.args }}
      - name: Build the web host of the sample
        if: matrix.name == 'android'
        working-directory: samples/Blux.Maui
        run: dotnet build Blux.Maui.Web/Blux.Maui.Web.csproj -c Release
      # Built from the source of the library (templates/Directory.Build.targets swaps the package), with the global.json of the template.
      - name: Build the Starter template head
        working-directory: templates/starter
        run: dotnet build src/Starter.Maui/Starter.Maui.csproj -f ${{ matrix.framework }} -c Release ${{ matrix.args }}
