<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page use the whole screen; Lux keeps its content inside the safe area (notch, gesture bar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lux on MAUI</title>
    <base href="/" />
    <!-- Lux without Tailwind in the app: the reset, then the components. The fonts and the theme variables are added to the head by LxHead. -->
    <link rel="stylesheet" href="_content/Lux.UI/lux.preflight.css" />
    <link rel="stylesheet" href="_content/Lux.UI/lux.css" />
    <link rel="icon" href="data:,">
    <style>
        /* The error bar of the template. */
        #blazor-error-ui { display: none; position: fixed; inset-inline: 0; bottom: 0; padding: 0.6rem 1.25rem; background: #fde68a; color: #000; z-index: 1000; }
        #blazor-error-ui .dismiss { cursor: pointer; position: absolute; inset-inline-end: 0.75rem; top: 0.5rem; }
    </style>
</head>

<body>
    <div id="app">Loading...</div>

    <!-- autostart="false" is the template's: the MAUI BlazorWebView starts Blazor itself. Lux's JS initializer (beforeStart, afterStarted) loads from _framework/blazor.modules.json. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
